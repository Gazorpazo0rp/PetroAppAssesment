services:
  db:
    image: postgres:16
    container_name: transfers_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transferevents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  api:
    build: .
    container_name: transfers_api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/transferevents
    ports:
      - "3000:3000"

  test:
    build: .
    command: npm test
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/transferevents
    profiles:
      - test

volumes:
  postgres_data: